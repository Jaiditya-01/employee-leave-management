name: Employee Leave Validation CI

on:
  push:
    branches: [ "main" ]

jobs:
  validate-leave-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Python Leave-Balance Validation Script
        run: python leave_app.py